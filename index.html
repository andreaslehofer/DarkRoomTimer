<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Timer für die analoge Dunkelkammer – Entwickler, Stoppbad, Fixierer, Wässern.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>DarkRoomTimer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>DarkRoomTimer</h1>
      <span id="wake-indicator" class="wake" title="Display bleibt an" hidden>● wach</span>
    </header>

    <nav class="steps" id="steps" aria-label="Prozessschritte"></nav>

    <section class="timer" aria-live="polite">
      <div class="timer__label" id="step-label">–</div>
      <div class="timer__display" id="display">00:00</div>
    </section>

    <div class="controls">
      <button type="button" id="btn-start" class="btn btn--primary">Start</button>
      <button type="button" id="btn-reset" class="btn">Reset</button>
      <button type="button" id="btn-next" class="btn">Weiter</button>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
