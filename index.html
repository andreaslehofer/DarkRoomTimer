<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Timer für die analoge Dunkelkammer – Entwickler, Stoppbad, Fixierer, Wässern.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>DarkRoomTimer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>DarkRoomTimer</h1>
      <span id="wake-indicator" class="wake" title="Display bleibt an" hidden>● wach</span>
    </header>

    <!-- Übersicht: alle Prozesse aus profiles/index.json -->
    <section id="view-list" class="view">
      <div id="profile-list" class="tiles" aria-label="Prozesse"></div>
    </section>

    <!-- Vorbereitung: Variante/Tank wählen, Schritte und Ansatz prüfen -->
    <section id="view-setup" class="view" hidden>
      <button type="button" class="back" data-action="back">‹ Prozesse</button>
      <h2 id="setup-name"></h2>
      <p id="setup-temp" class="meta"></p>
      <div id="setup-selects" class="selects"></div>
      <table class="steps-table" id="setup-steps"></table>
      <div id="setup-mixing"></div>
      <button type="button" id="btn-run" class="btn btn--primary btn--wide">Start</button>
    </section>

    <!-- Lauf: läuft ohne Handbedienung von Schritt zu Schritt -->
    <section id="view-run" class="view run" hidden>
      <div class="run__head">
        <span id="run-name"></span>
        <span id="run-total" class="meta"></span>
      </div>
      <div class="run__main" aria-live="polite">
        <div id="run-status" class="run__status"></div>
        <div id="run-step" class="run__step"></div>
        <div id="run-canister" class="meta"></div>
        <div id="run-display" class="run__display">0:00</div>
        <div id="run-next" class="run__next"></div>
      </div>
      <ol id="run-progress" class="progress"></ol>
      <div class="controls">
        <button type="button" id="btn-pause" class="btn btn--primary">Pause</button>
        <button type="button" id="btn-skip" class="btn">Weiter ›</button>
        <button type="button" id="btn-stop" class="btn">Abbrechen</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
